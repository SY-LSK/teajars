<!DOCTYPE html>
<html>
    <head>
        <title>teajarsKV</title>
        <style>
            .logo{
                font-size: 32px;
                font-weight: bold;
                text-align: center;
                color: #333;
            }
        </style>
    </head>
    <body>
        <h1 class="logo">teajarsKV</h1>
        <p id="version" style="text-align: center;">version:<span id="v"></span></p>
        <p id="data" style="text-align: center;"></p>
        <script>
            fetch("/api/version")
            .then(response => response.json())
            .then(data => {
                document.getElementById("v").textContent = data.version;
                document.getElementById("data").textContent = data.data;
            })
            .catch(error => document.getElementById("version").textContent = "Error:" + error);
        </script>
    </body>
</html>
